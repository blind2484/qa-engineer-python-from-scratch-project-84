---
- summary: |
    Проверка поиска товаров по ключевому слову
  requirement: |
    При вводе ключевого слова отобразятся только соответствующие товары
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Ключевое слово = смартфон
  steps:
    - В поле "Поиск" вводим ключевое слово
    - Нажимаем  клавишу "Enter" или иконку лупы рядом с полем поиска
  expected-result: |
    На странице отображаются товары, соответствующие запросу

- summary: |
    Проверка поиска товаров по невалидному ключевому слову
  requirement: |
    При вводе невалидного ключевого слова на странице будет выведено сообщение об отсутствии таких товаров
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Ключевое слово = табак
  steps:
    - В поле "Поиск" вводим ключевое слово
    - Нажимаем  клавишу "Enter" или иконку лупы рядом с полем поиска
  expected-result: |
    Отображается страница с уведомлением, что таких товаров нет

- summary: |
    Проверка возможности искать товары по категории
  requirement: |
    При выборе категии отобразятся только товары, входящие в неё
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    -
  steps:
    - Нажать на кнопку "Категория"
    - Выбрать любой из предложенных вариантов
  expected-result: |
    На странице отобразятся только товары выбранной категории

- summary: |
    Проверка работы фильтра "Цена"
  requirement: |
    При применении фильтра показываются только подходящие под его условия товары
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Цена от = 10, цена до = 70
  steps:
    - Вводим значение в поле "От"
    - Вводим значение в поле "До"
  expected-result: |
    Отображаются только товары, удовлетворяющие условиям

- summary: |
    Проверка работы фильтра "Цена" с неликвидными символами
  requirement: |
    В поля "От" и "До" можно вводить только цифры
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Цена от = буквы и/или спецсимволы, цена до = буквы и/или спецсимволы
  steps:
    - Вводим значение в поле "От"
    - Вводим значение в поле "До"
  expected-result: |
    Буквы или спецсимволы ввести нельзя

- summary: |
