---
- summary: |
    Успешная регистрация нового пользователя
  requirement: |
    При вводе валидных логина и пароля в системе будет зарегистрирован новый пользователь с указанными логином и паролем
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница регистрации
  test-data: |
    Логин = login Пароль = password Подтверждение пароля = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим подтверждение пароля
    - Нажимаем кнопку "Войти"
  expected-result: |
    Пользователь зарегистрирован в системе
    Пользователь должен получить уведомление о регистрации
    Переход на главную страницу

- summary: |
    Не успешная регистрация нового пользователя
  requirement: |
    При вводе невалидного логина система выдаёт ошибку
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница регистрации
  test-data: |
    Логин = @ Пароль = password Подтверждение пароля = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим подтверждение пароля
    - Нажимаем кнопку "Войти"
  expected-result: |
    Система просит ввести валидный логин

