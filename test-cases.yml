    Не успешная регистрация нового пользователя
  requirement: |
    При вводе неверного подтверждения пароля система выдаёт ошибку
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница регистрации
  test-data: |
    Логин = login Пароль = password Подтверждение пароля = psswrd
  steps:
    - Вводим логин
    - Вводим пароль
    - Вводим подтверждение пароля
    - Нажимаем кнопку "Войти"
  expected-result: |
    Система просит ввести подтверждение пароля, совпадающее с паролем

- summary: |
    Проверка входа пользователя с существующими логином и паролем
  requirement: |
    При верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Установлен язык: "Русский"
    пользователь зарегистрирован
    открыта страница логина
  test-data: |
    Логин = login Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку "Войти"
  expected-result: |
    Пользователь должен получить уведомление об авторизации
    Переход на главную страницу

- summary: |
    Проверка входа пользователя с несуществующими логином и паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница логина
  test-data: |
    Логин = hexlet Пароль = badpass
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку "Войти"
  expected-result: |
    Пользователь должен получить сообщение об ошибке
    Переход к повторной авторизации

- summary: |
    Проверка поиска товаров по ключевому слову
  requirement: |
    При вводе ключевого слова отобразятся только соответствующие товары
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Ключевое слово = смартфон
  steps:
    - В поле "Поиск" вводим ключевое слово
    - Нажимаем  клавишу "Enter" или иконку лупы рядом с полем поиска
  expected-result: |
    На странице отображаются товары, соответствующие запросу

- summary: |
    Проверка поиска товаров по невалидному ключевому слову
  requirement: |
    При вводе невалидного ключевого слова на странице будет выведено сообщение об отсутствии таких товаров
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Ключевое слово = табак
  steps:
    - В поле "Поиск" вводим ключевое слово
    - Нажимаем  клавишу "Enter" или иконку лупы рядом с полем поиска
  expected-result: |
    Отображается страница с уведомлением, что таких товаров нет

- summary: |
    Проверка возможности искать товары по категории
  requirement: |
    При выборе категии отобразятся только товары, входящие в неё
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
  steps:
    - Нажать на кнопку "Категория"
    - Выбрать любой из предложенных вариантов
  expected-result: |
    На странице отобразятся только товары выбранной категории

- summary: |
    Проверка работы фильтра "Цена"
  requirement: |
    При применении фильтра показываются только подходящие под его условия товары
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Цена от = 10, цена до = 70
  steps:
    - Вводим значение в поле "От"
    - Вводим значение в поле "До"
  expected-result: |
    Отображаются только товары, удовлетворяющие условиям

- summary: |
    Проверка возможности просматривать подробную информацию о товаре
  requirement: |
    При нажатии на товар открывается карточка товара с подробной информацией о нём
  prerequisites: |
    Открыта страница с товарами
  test-data: |
  steps:
    - Нажимаем на любой товар
  expected-result: |
    Открывается карточка товара

- summary: |
    Проверка добавления товара в корзину
  requirement: |
    При нажатии кнопки "Добавить" товар добавится в корзину
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Количество товара = 2
  steps:
    - Нажать кнопку "В корзину"
    - Указать количество товара
    - Нажать кнопку "Добавить"
  expected-result: |
    Товар добавлен в корзину
    Показано сообщение, что товар цспешно добавлен в корзину

- summary: |
    Проверка просмотра корзины
  requirement: |
    При нажатии на "Корзину" отображаются добавленные в неё товары    
  prerequisites: |
    Установлен язык: "Русский"
    В корзине есть товары 
  test-data: |
  steps:
    - Нажать кнопку "Корзина"
  expected-result: |
    Открывается страница с корзиной, содержащей добавленные в неё товары

- summary: |
    Проверка наличия мобильной версии сайта
  requirement: |
    При открытии сайта на мобильном устройстве, сайт отображается корректно
  prerequisites: |
  test-data: |
    Мобильное устройство
  steps:
    - Открыть сайт на мобильном устройстве
  expected-result: |
    Сайт корректно отобразится

- summary: |
    Проверка работы возможности изменить язык интерфейса
  requirement: |
    При переключении языка интерфейса, сайт отображается на выбранном языке
  prerequisites: |
   Установлен язык: "Русский"
    Открыта любая страница сайта
  test-data: |
    Язык: Английский   
  steps:
    - Нажать на кнопку "Язык"
    - Выбрать язык
  expected-result: |
    Язык сайта изменился на английский
