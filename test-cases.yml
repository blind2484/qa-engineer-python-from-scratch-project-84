  test-data: |
  steps:
    - Нажимаем на любой товар
  expected-result: |
    Открывается карточка товара

- summary: |
    Проверка добавления товара в корзину
  requirement: |
    При нажатии кнопки "Добавить" товар добавится в корзину, а в DevTools отображается успешный запрос на добавление товара, ошибок в Console нет.
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Количество товара = 2
  steps:
    - Нажать кнопку "В корзину"
    - Указать количество товара
    - Нажать кнопку "Добавить"
  expected-result: |
    Товар добавлен в корзину. Показано сообщение, что товар успешно добавлен в корзину. Запрос в DevTools без ошибок.

- summary: |
    Проверка наличия товара в корзине после повторного открытия страницы
  requirement: |
    При повторном открытии страницу добавленный товар остаётся в корзине
  prerequisites: |
    Открыта страница с товарами
    В корзину добавлены товары
  test-data: |
  steps:
    - закрыть страницу магазина
    - открыть страницу магазина по ссылке или набрав адрес а адресной строке браузера
  expected-result: |
    Добавленные товары остались в корзине

