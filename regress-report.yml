    expected-result: |
      Отображаются все бренды товаров, из всего списка
    actual-result: |
      Отображаются только бренды товаров, присутствующих на текущей странице без фильтра
  
  - summary: |
      В фильтре "Category" отображаются только категории товаров с на текущей страницы
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      - открыть страницу магазина https://products-store.hexlet.app/
      - Нажать на выпадающий список "Category"
    expected-result: |
      Отображаются все категории товаров, из всего списка
    actual-result: |
      Отображаются только категории товаров, присутствующих на текущей странице без фильтра
  
  - summary: |
      Фильтр "Category" нельзя выбрать несколько категорий товара
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      - открыть страницу магазина https://products-store.hexlet.app/
      - Нажать на выпадающий список "Category"
      - выбрать какую-нибудь категорию
      - выбрать ещё одну категорию
    expected-result: |
      Отображаются товары двух категорий
    actual-result: |
      Отображаются только товары одной из категорий. Категорию можно поменять, но нельзя выбрать несколько
  
  - summary: |
      Невозможно поставить рейтинг товара
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
