---
- summary: |
    Невозможно зарегистрировать нового пользователя
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce:
    - зайти на сайт
    - зарегистрироваться
  expected-result: |
    Создан новый пользователь
  actual-result: |
    Нет ни кнопки, ни вкладки, ни полей для регистрации нового пользователя

