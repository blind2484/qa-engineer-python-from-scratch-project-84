- summary: |
    Фильтр "Price" не учитывает скидку
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    открыть страницу магазина https://products-store.hexlet.app/
    в поле "From" ввести значение 12
    в поле "To" ввести значение 17
  expected-result: |
    Отображаются только товары текущая цена которых выше 12$ и ниже 17$
  actual-result: |
    Отображаются товары у которых цена выше 12$, хоть их текущая цена со скидкой ниже 12$ и не отображаются товары, цена которых, без скидки выше 17$, а со скидкой ниже

