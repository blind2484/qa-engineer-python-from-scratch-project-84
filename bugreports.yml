---
- summary: |
    Некорректная работа добавления товара в корзину 
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    открыть страницу магазина https://products-store.hexlet.app/
    нажать на "Add to cart" у любого товара
    выбрать количество товара
    нажать "Добавить"
    закрыть страницу магазина
    открыть страницу магазина https://products-store.hexlet.app/
  expected-result: |
    Запрос на количество добавляемого товара;
    Товар добавлен в корзину;
    Пользователь получил уведомление о добавлении;
    Счетчик количества товара в корзине изменился;
    Запрос в DevTools выполнен без ошибок
    После повторного открытия страницы товар сохранился в корзине
  actual-result: |
    Счётчик изменился, товар в корзине отобразился, но нет ни уведомления о добавлении, ни запросов в DevTools, а после повторного открытия страницу корзина пустая
    # screenshots/HexletStore_v1_add_no_request_00.png

