bugreports:
  - summary: |
      Некорректная работа добавления товара в корзину 
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      нажать на "Add to cart" у любого товара
      выбрать количество товара
      нажать "Добавить"
      закрыть страницу магазина
      открыть страницу магазина https://products-store.hexlet.app/
    expected-result: |
      Запрос на количество добавляемого товара;
      Товар добавлен в корзину;
      Пользователь получил уведомление о добавлении;
      Счетчик количества товара в корзине изменился;
      Запрос в DevTools выполнен без ошибок
      После повторного открытия страницы товар сохранился в корзине
    actual-result: |
      Счётчик изменился, товар в корзине отобразился, но нет ни уведомления о добавлении, ни запросов в DevTools, а после повторного открытия страницу корзина пустая
  
  - summary: |
      Невозможно оформить заказ
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      нажать на "Add to cart" у любого товара
      перейти в корзину
      нажать "Checkout"
      закрыть всплывающее окно "Order placed successfully"
    expected-result: |
      Заказ оформлен
    actual-result: |
      Статус 500 в DevTools
  
  - summary: |
      всплывающее окно "Order placed successfully" не закрывается "крестиком"
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      нажать на "Add to cart" у любого товара
      перейти в корзину
      нажать "Checkout"
      закрыть всплывающее окно "Order placed successfully" "крестиком"
    expected-result: |
      Окно закрыто
    actual-result: |
      По "крестику" окно "Order placed successfully" не закрывается
  
  - summary: |
      Интерфейс "плывёт" на разрешениях смартфонов
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      добавить товары в корзину
      перейти в корзину
      открыть DevTools
      открыть режим адаптивного дизайна
      выбрать устройство Pixel 5 Androoid 10
    expected-result: |
      Сайт отображается корректно
    actual-result: |
      Вёрстка сайта нарушена
  
  - summary: |
      Фильтр "Price" не учитывает скидку
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      в поле "From" ввести значение 6
      в поле "To" ввести значение 9
    expected-result: |
      Отображаются только товары текущая цена которых выше 6$ и ниже 9$
    actual-result: |
      Отображаются товары у которых цена выше 6$, хоть их текущая цена со скидкой ниже 6$ и не отображаются товары, цена которых, без скидки выше 9$, а со скидкой ниже
  
  - summary: |
      Фильтр "Price" - можно вводить буквы и символы
    environment: |
      MSI P75 Creator 9SE;
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      в поле "From" ввести значение "asd@"
    expected-result: |
      Ввести буквы и символы невозможно
    actual-result: |
      буквы и символы вводятся

  - summary: |
      Фильтры "Price" действуют не на весь список товаров, а только на товары на текущей страницы
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce:
      открыть страницу магазина https://products-store.hexlet.app/
      в поле "From" ввести значение 12
      в поле "To" ввести значение 17
    expected-result: |
      Отображаются все товары, из всего списка, попадающие в диапозон цен
    actual-result: |
      Отображаются только товары, присутствующие на текущей странице без фильтра
  
  - summary: |
      В фильтре "Brand" отображаются только бренды товаров с текущей страницы
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce: |
      открыть страницу магазина https://products-store.hexlet.app/
      проверить содержание фильтра "Brend"
    expected-result: |
      Отображаются все бренды товаров, из всего списка
    actual-result: |
      Отображаются только бренды товаров, присутствующих на текущей странице без фильтра

  - summary: |
      В фильтре "Category" отображаются только категории товаров с текущей страницы
    environment: |
      MSI P75 Creator 9SE
      Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045
      FireFox 151.0.3 (64-разрядный)
    steps-to-reproduce: |
      открыть страницу магазина https://products-store.hexlet.app/
