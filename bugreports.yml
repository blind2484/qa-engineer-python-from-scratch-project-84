---
- summary: |
    Невозможно зарегистрировать нового пользователя
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    - зайти на сайт
    - зарегистрироваться
  expected-result: |
    Создан новый пользователь
  actual-result: |
    Нет ни кнопки, ни вкладки, ни полей для регистрации нового пользователя

- summary: |
    Невозможно авторизироваться
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    - зайти на сайт
    - авторизироваться
  expected-result: |
    Пользователь авторизирован
  actual-result: |
    Нет ни кнопки, ни вкладки, ни полей для авторизации пользователя

- summary: |
    Некорректная работа добавления товара в корзину 
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    - открыть страницу магазина https://products-store.hexlet.app/
    - нажать на "Add to cart" у любого товара
    - выбрать количество товара
    - нажать "Добавить"
    - закрыть страницу
    - открыть страницу
  expected-result: |
    Запрос на количество добавляемого товара;
    Товар добавлен в корзину;
    Пользователь получил уведомление о добавлении;
    Счетчик количества товара в корзине изменился;
    Запрос в DevTools выполнен без ошибок
    После повторного открытия страницы товар сохранился в корзине
  actual-result: |
    Счётчик изменился, товар в корзине отобразился, но нет ни уведомления о добавлении, ни запросов в DevTools, а после повторного открытия страницу корзина пустая

- summary: |
    Невозможно оформить заказ
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    - открыть страницу магазина https://products-store.hexlet.app/
    - нажать на "Add to cart" у любого товара
    - перейти в корзину
    - нажать "Checkout"
    - закрыть всплывающее окно "Order placed successfully"
  expected-result: |
    Заказ оформлен
  actual-result: |
    Статус 500 в DevTools

- summary: |
