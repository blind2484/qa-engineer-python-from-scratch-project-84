- summary: |
    Перемотка списка товаров до последней страницы и обратно сбивает список товаров
  environment: |
    MSI P75 Creator 9SE;
    Microsoft Windows 10 Домашняя Версия 10.0.19045 Сборка 19045;
    FireFox 151.0.3 (64-разрядный)
  steps-to-reproduce: |
    открыть страницу магазина https://products-store.hexlet.app/
    нажать кнопку "Next" 6 раз
    нажать кнопку "Previous" 6 раз
    сравнить отображение товара со стартовой страницей
  expected-result: |
    На первой странице список товаров идентичен при открытии сайта и при возвращении на первую страницу с последней
  actual-result: |
    Список товаров "сбивается" и часть товаров с первой страницы не отображаются

