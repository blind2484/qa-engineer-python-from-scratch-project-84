  requirement: |
    При нажатии на товар открывается карточка товара с подробной информацией о нём
  prerequisites: |
    Открыта страница с товарами
  test-data: |
    -
  steps:
    - Нажимаем на любой товар
  expected-result: |
    Открывается карточка товара

- summary: |
    Проверка добавления товара в корзину
  requirement: |
    При нажатии кнопки "Добавить" товар добавится в корзину
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Количество товара = 2
  steps:
    - Нажать кнопку "В корзину"
    - Указать количество товара
    - Нажать кнопку "Добавить"
  expected-result: |
    Товар добавлен в корзину

- summary: |
    Проверка запроса в DevTools при добавления товара в корзину 
  requirement: |
    При нажатии кнопки "Добавить" в DevTools отображается успешный запрос на добавление товара, ошибок в Console нет.
  prerequisites: |
    Установлен язык: "Русский"
    Открыта страница с товарами
  test-data: |
    Количество товара = 2
  steps:
    - Нажать кнопку "В корзину"
    - Указать количество товара
    - Нажать кнопку "Добавить"
  expected-result: |
    Запрос в DevTools без ошибок.

